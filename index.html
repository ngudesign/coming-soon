<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lisa Nguyen — Portfolio coming soon</title>
  <meta name="description" content="Lisa Nguyen, product designer. Portfolio coming soon.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234A2224' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 12c1-5 4.5-8 8-7.5 2.6.4 2 4.6-2 6.4-1.8.8-3.6 1-6 1.1 3.4.6 6 2.4 5.6 5-.4 2.4-3.6 1.6-5.6-5'/%3E%3Cpath d='M12 12c1-5 4.5-8 8-7.5 2.6.4 2 4.6-2 6.4-1.8.8-3.6 1-6 1.1 3.4.6 6 2.4 5.6 5-.4 2.4-3.6 1.6-5.6-5' transform='translate(24 0) scale(-1 1)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gloock&family=Literata:ital,opsz,wght@1,7..72,400&display=swap" rel="stylesheet">
  <style>
    /* Same palette as the portfolio */
    :root {
      --paper:  #FBFAF8;
      --accent: #4A2224;   /* Oxblood Ink */
      --muted:  #634F4E;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }

    body {
      background: var(--paper);
      color: var(--accent);
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
      animation: rise .9s cubic-bezier(.22, .7, .2, 1) both;
    }

    /* Name logo: butterfly + name, as in the portfolio sidebar, larger */
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      font-family: "Gloock", Georgia, serif;
      font-weight: 400;
      font-size: clamp(36px, 7vw, 56px);
      line-height: 1;
      letter-spacing: -0.01em;
    }

    .logo svg {
      flex: none;
      width: 0.9em;
      height: 0.9em;
    }

    .tagline {
      margin: 0;
      font-family: "Literata", Georgia, serif;
      font-style: italic;
      font-size: clamp(17px, 2.4vw, 20px);
      color: var(--muted);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 12c1-5 4.5-8 8-7.5 2.6.4 2 4.6-2 6.4-1.8.8-3.6 1-6 1.1 3.4.6 6 2.4 5.6 5-.4 2.4-3.6 1.6-5.6-5" />
        <path d="M12 12c1-5 4.5-8 8-7.5 2.6.4 2 4.6-2 6.4-1.8.8-3.6 1-6 1.1 3.4.6 6 2.4 5.6 5-.4 2.4-3.6 1.6-5.6-5" transform="translate(24 0) scale(-1 1)" />
      </svg>
      Lisa Nguyen
    </h1>
    <p class="tagline">Portfolio coming soon</p>
  </main>
</body>
</html>
